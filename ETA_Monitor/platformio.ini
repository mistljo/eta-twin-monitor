; ============================================================
;  ETA Monitor – PlatformIO Konfiguration
;  ESP32 (eByte ECM50-A)  |  COM9  |  OTA-fähig
; ============================================================

[platformio]
; Sketch-Verzeichnis: .ino + config.h liegen direkt hier (nicht in src/)
src_dir     = .
include_dir = .

[env:eta_monitor]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- Upload (USB / erstmaliges Flashen) ---
; COM-Port anpassen
upload_port  = COM9
upload_speed = 921600

; --- OTA-Upload (IP statt COM-Port angeben) ---
; Das Passwort (OTA_PASS aus config.h) wird NICHT hier gespeichert, sondern aus der
; Umgebungsvariable ETA_OTA_PASS gelesen, z. B. in PowerShell:
;   $env:ETA_OTA_PASS = "<OTA_PASS aus config.h>"
;   pio run -t upload --upload-port <IP-des-Monitors>
upload_protocol  = espota
upload_flags     = --auth=${sysenv.ETA_OTA_PASS}

; --- Serieller Monitor ---
monitor_port  = COM9
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; --- OTA-fähige Partitionstabelle ---
; min_spiffs: App0 (ota_0) = 1,9 MB  |  App1 (ota_1) = 1,9 MB  |  SPIFFS = 190 KB
; Beide App-Slots werden für den Rollback-Mechanismus benötigt.
board_build.partitions = min_spiffs.csv
board_build.flash_mode = qio
board_build.f_flash    = 80000000L

; --- Build-Flags ---
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0

; --- Keine externen Libraries nötig ---
; ArduinoOTA, Update, WiFi, WebServer, esp_ota_ops sind im ESP32-Core enthalten
